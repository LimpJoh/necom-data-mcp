# Körs på VPS:en: cd /opt/necom-data-mcp/app && docker compose up -d --build
# Hemligheter läses från /opt/necom-data-mcp/.env och /opt/necom-data-mcp/data/ på värden – de ligger aldrig i repot.
services:
  necom-data-mcp:
    build: .
    image: necom-data-mcp:latest
    container_name: necom-data-mcp
    restart: unless-stopped
    env_file:
      - /opt/necom-data-mcp/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3010"
      MCP_STATE_FILE: /app/data/oauth-state.json
      GOOGLE_APPLICATION_CREDENTIALS: /app/data/ga4-service-account.json
      OPS_AUDIT_LOG: /app/data/ops-audit.log
      OPS_SSH_KEY_FILE: /app/data/ops_ssh_key
      OPS_SSH_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"   # låter ops_vps_exec nå värden via SSH
    volumes:
      - /opt/necom-data-mcp/data:/app/data
    ports:
      - "127.0.0.1:3006:3010"
