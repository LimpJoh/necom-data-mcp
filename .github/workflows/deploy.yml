name: Deploy till VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Förbered SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Skriv hemligheter till tillfälliga filer
        run: |
          mkdir -p .secrets
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .secrets/.env
          if [ -n "${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' '${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}' > .secrets/ga4-service-account.json
          fi

      - name: Synka kod till servern
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}"
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude data --exclude .secrets --exclude .git \
            -e "$SSH" ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ vars.APP_DIR || '/var/www/necom-data-mcp' }}/"

      - name: Lägg hemligheter på plats
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}"
          APP="${{ vars.APP_DIR || '/var/www/necom-data-mcp' }}"
          $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p $APP/data && chmod 700 $APP/data"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.VPS_PORT || 22 }} .secrets/.env "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP/.env"
          if [ -f .secrets/ga4-service-account.json ]; then
            scp -i ~/.ssh/deploy_key -P ${{ secrets.VPS_PORT || 22 }} .secrets/ga4-service-account.json "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP/data/ga4-service-account.json"
          fi
          $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "chmod 600 $APP/.env $APP/data/*.json 2>/dev/null || true"

      - name: Bygg och starta om (PM2)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ vars.APP_DIR || '/var/www/necom-data-mcp' }} && chmod +x deploy.sh && ./deploy.sh"

      - name: Verifiera publikt
        run: |
          URL="${{ vars.PUBLIC_URL || 'https://mcp.necom.se' }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health"; then echo; echo "OK: $URL/health"; exit 0; fi
            sleep 5
          done
          echo "Hälsokontrollen svarade inte på $URL/health"; exit 1

      - name: Städa
        if: always()
        run: rm -rf .secrets ~/.ssh/deploy_key
